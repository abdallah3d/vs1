<title>قطة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#E8ECE6; --ink:#1B211D; --ink-2:#3F4A43; --muted:#6B766F;
  --line:#D8DFD9; --accent:#1E7F5C; --accent-ink:#FFFFFF; --accent-soft:#DDEFE6;
  --coin:#F2C230; --coin-ink:#3A2C00; --bad:#B3392F; --warn:#9A6400;
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101412; --surface:#181E1B; --sunk:#202824; --ink:#E6ECE8; --ink-2:#BDC8C1; --muted:#8B978F;
    --line:#2C3631; --accent:#4FC596; --accent-ink:#06231A; --accent-soft:#193A2D;
    --coin:#F2C230; --coin-ink:#3A2C00; --bad:#EE7B6E; --warn:#E3B04F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101412; --surface:#181E1B; --sunk:#202824; --ink:#E6ECE8; --ink-2:#BDC8C1; --muted:#8B978F;
  --line:#2C3631; --accent:#4FC596; --accent-ink:#06231A; --accent-soft:#193A2D;
  --coin:#F2C230; --coin-ink:#3A2C00; --bad:#EE7B6E; --warn:#E3B04F;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:2.2rem;font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.money{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--coin);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.coin{width:40px;height:40px;border-radius:50%;background:var(--coin);color:var(--coin-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.1rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.status{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--accent)}

.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--accent);padding:0;font-weight:600}

.banner{background:var(--accent-soft);color:var(--ink-2);border-radius:12px;padding:10px 14px;font-size:.9rem}

.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-align:right;color:inherit;width:100%}
button.card:hover{border-color:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:.75rem;font-weight:600;border-radius:999px;padding:1px 10px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.tag.goal{background:var(--accent-soft);color:var(--accent)}
.tag.bill{background:#F9EBC0;color:#6A4E00}
:root[data-theme="dark"] .tag.bill{background:#3A3217;color:var(--coin)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.bill{background:#3A3217;color:var(--coin)}}
.tag.done{background:var(--accent);color:var(--accent-ink)}
.bar{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}

.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* detail */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.members{display:flex;flex-direction:column;gap:8px}
.member{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.member.paid{border-color:var(--accent);background:var(--accent-soft)}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent;font-weight:800}
.member.paid .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check:disabled{cursor:default}
.member .name{font-weight:600}
.member .sub{font-size:.8rem;color:var(--muted)}
.member input{width:96px}
.x{background:none;border:0;color:var(--muted);font-size:1.2rem;padding:4px 8px}

.addrow{display:flex;gap:8px}
.addrow input{flex:1}

/* form */
.form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 8px;color:var(--ink-2);font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:center}
.seg button small{font-weight:400;font-size:.75rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.three{grid-template-columns:repeat(3,1fr)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--ink-2)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:.8rem;color:var(--muted)}
.err{color:var(--bad);font-size:.88rem}
.share{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:.9rem}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9rem;z-index:10}
@media (max-width:420px){
  .stats{grid-template-columns:1fr 1fr 1fr}
  .stat b{font-size:1rem}
  .two{grid-template-columns:1fr}
  .member input{width:80px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" dir="rtl" lang="ar" id="app">
  <div class="top">
    <div class="brand"><div class="coin" aria-hidden="true">ق</div><div><h1>قطة</h1></div></div>
    <div class="status" id="status"><span class="dot"></span><span>يحمّل…</span></div>
  </div>
  <div id="view"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const r2 = n => Math.round((+n||0)*100)/100;
  const fmt = n => r2(n).toLocaleString('en-US',{maximumFractionDigits:2});
  const uid = () => Math.random().toString(36).slice(2,10);
  const LS = 'qatta.v1';

  /* ---------- examples (shown only when there is nothing saved, never stored) ---------- */
  const EXAMPLES = [
    {id:'ex1', example:true, type:'goal', title:'هدية تخرج سلمان', target:1200, split:'equal', iban:'SA00 0000 0000 0000 0000 0000', deadline:'',
     members:[{id:'a',name:'عبدالله',paid:true},{id:'b',name:'فهد',paid:true},{id:'c',name:'ناصر',paid:false},{id:'d',name:'تركي',paid:true},{id:'e',name:'ماجد',paid:false},{id:'f',name:'سعود',paid:false}], createdAt:2},
    {id:'ex2', example:true, type:'bill', title:'عشاء الخميس', total:640, tip:0, split:'equal', payerId:'a',
     members:[{id:'a',name:'عبدالله',paid:true},{id:'b',name:'فهد',paid:true},{id:'c',name:'ناصر',paid:false},{id:'d',name:'تركي',paid:false}], createdAt:1}
  ];

  /* ---------- storage ---------- */
  let items = [];           // saved qattas
  let db = null, shared = false, readOnly = false;
  let route = {name:'list'}; // list | detail{id} | new
  let draft = null;
  let exampleState = JSON.parse(JSON.stringify(EXAMPLES));

  function loadLocal(){ try{ const v = JSON.parse(localStorage.getItem(LS)||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
  function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(items)); }catch(e){} }

  // one write at a time per document; the latest state wins
  const pending = {}, inflight = {};
  function persist(q){
    if(q.example) return;
    q.updatedAt = Date.now();
    if(!shared){ saveLocal(); return; }
    pending[q.id] = JSON.parse(JSON.stringify(q));
    if(!inflight[q.id]) flush(q.id);
  }
  async function flush(id){
    inflight[id] = true;
    while(pending[id]){
      const body = pending[id]; delete pending[id];
      try{ await db.collection('qattas').doc(id).set(body); }
      catch(e){
        if(e && e.code==='invalid_argument'){ readOnly = true; toast('ما عندك صلاحية تعديل هذه القطة'); render(); }
        else if(e && e.code==='quota_exceeded'){ toast('وصلت الحد الأعلى للقطات. احذف قطة قديمة'); }
        else if(e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); pending[id] = pending[id] || body; }
        else toast('ما انحفظ التعديل، حاول مرة ثانية');
      }
    }
    inflight[id] = false;
  }
  async function removeDoc(id){
    items = items.filter(x=>x.id!==id);
    if(shared){ try{ await db.collection('qattas').doc(id).delete(); }catch(e){ toast('ما انحذفت، حاول مرة ثانية'); } }
    else saveLocal();
  }

  function setStatus(){
    $('status').innerHTML = shared
      ? `<span class="dot on"></span><span>${readOnly?'عرض فقط':'مشتركة مع كل من معه الرابط'}</span>`
      : `<span class="dot"></span><span>محفوظة على جهازك فقط</span>`;
  }

  /* ---------- math ---------- */
  function totalOf(q){ return q.type==='bill' ? r2(q.total*(1+(+q.tip||0)/100)) : r2(q.target); }
  function shareOf(q,m){
    if(q.split==='custom') return r2(m.amount);
    if(q.split==='open') return r2(m.amount);
    return q.members.length ? r2(totalOf(q)/q.members.length) : 0;
  }
  function summary(q){
    const total = totalOf(q);
    let collected = 0, paidCount = 0;
    q.members.forEach(m=>{ if(m.paid){ paidCount++; collected += shareOf(q,m); } });
    if(q.split==='open') collected = q.members.reduce((s,m)=>s+(+m.amount||0),0), paidCount = q.members.filter(m=>(+m.amount||0)>0).length;
    let owed = total; // amount the collector / payer waits for
    if(q.type==='bill'){
      const payer = q.members.find(m=>m.id===q.payerId);
      owed = r2(total - (payer?shareOf(q,payer):0));
      collected = q.members.filter(m=>m.id!==q.payerId && m.paid).reduce((s,m)=>s+shareOf(q,m),0);
    }
    const remaining = Math.max(0, r2((q.type==='bill'?owed:total) - collected));
    const base = q.type==='bill'?owed:total;
    const pct = base>0 ? Math.min(100, collected/base*100) : 0;
    const assigned = q.members.reduce((s,m)=>s+shareOf(q,m),0);
    return {total, collected:r2(collected), remaining, pct, paidCount, done: base>0 && remaining<=0.009, assigned:r2(assigned)};
  }
  function payerName(q){ const p = q.members.find(m=>m.id===q.payerId); return p?p.name:''; }

  /* ---------- views ---------- */
  function all(){ return (items.length ? items : exampleState).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); }
  function find(id){ return items.find(x=>x.id===id) || exampleState.find(x=>x.id===id); }

  function render(){
    setStatus();
    if(route.name==='detail' && !find(route.id)) route={name:'list'};
    const v = $('view');
    if(route.name==='list') v.innerHTML = listView();
    else if(route.name==='new') v.innerHTML = formView();
    else v.innerHTML = detailView(find(route.id));
  }

  function listView(){
    const showingExamples = !items.length;
    const cards = all().map(q=>{
      const s = summary(q);
      const sub = q.type==='bill'
        ? `${esc(payerName(q))} دفع <span class="money">${fmt(s.total)}</span> ريال`
        : `الهدف <span class="money">${fmt(s.total)}</span> ريال`;
      return `<button class="card" data-open="${esc(q.id)}">
        <div class="row"><h3>${esc(q.title)}</h3><span class="tag ${s.done?'done':q.type}">${s.done?'اكتملت':q.type==='bill'?'فاتورة':'جمع'}</span></div>
        <div class="row small muted"><span>${sub}</span><span>${q.type==='bill'?q.members.filter(m=>m.id!==q.payerId&&m.paid).length+' من '+(q.members.length-1)+' سدّدوا':s.paidCount+' من '+q.members.length+' دفعوا'}</span></div>
        <div class="bar" aria-hidden="true"><i style="width:${s.pct}%"></i></div>
      </button>`;
    }).join('');
    return `<div class="list">
      <div class="row"><h2>قطاتك</h2>${readOnly?'':'<button class="btn" data-act="new">+ قطة جديدة</button>'}</div>
      ${showingExamples?'<div class="banner">هذه أمثلة للتجربة، والتعديل عليها ما ينحفظ. سوّ قطتك الأولى من زر «قطة جديدة».</div>':''}
      ${cards}
    </div>`;
  }

  function detailView(q){
    const s = summary(q);
    const bill = q.type==='bill', open = q.split==='open';
    const lock = readOnly;
    const members = q.members.map(m=>{
      const isPayer = bill && m.id===q.payerId;
      const sh = shareOf(q,m);
      let right = '', sub = '';
      if(open){
        right = `<input type="number" inputmode="decimal" min="0" step="1" id="amt-${esc(m.id)}" data-amt="${esc(m.id)}" value="${m.amount||''}" placeholder="0" aria-label="مبلغ ${esc(m.name)}" ${lock?'disabled':''}>`;
        sub = (+m.amount||0)>0 ? 'ساهم' : 'ما ساهم للحين';
      } else if(q.split==='custom'){
        right = `<input type="number" inputmode="decimal" min="0" step="1" id="amt-${esc(m.id)}" data-amt="${esc(m.id)}" value="${m.amount||''}" placeholder="0" aria-label="نصيب ${esc(m.name)}" ${lock?'disabled':''}>`;
        sub = isPayer ? 'دفع الفاتورة' : (m.paid?'سدّد':'باقي عليه');
      } else {
        right = `<span class="money">${fmt(sh)}</span>`;
        sub = isPayer ? 'دفع الفاتورة' : (m.paid?(bill?'سدّد':'دفع'):'باقي عليه');
      }
      const paid = open ? (+m.amount||0)>0 : (m.paid||isPayer);
      const toggle = open||isPayer
        ? `<span class="check" aria-hidden="true">✓</span>`
        : `<button class="check" data-toggle="${esc(m.id)}" aria-pressed="${!!m.paid}" aria-label="${m.paid?'إلغاء الدفع':'تم الدفع'}: ${esc(m.name)}" ${lock?'disabled':''}>✓</button>`;
      return `<div class="member ${paid?'paid':''}">${toggle}
        <div><div class="name">${esc(m.name)}${lock||isPayer?'':` <button class="x" data-rm="${esc(m.id)}" aria-label="حذف ${esc(m.name)}">×</button>`}</div><div class="sub">${sub}</div></div>
        <div>${right}</div></div>`;
    }).join('');

    let warn = '';
    if(q.split==='custom' && Math.abs(s.assigned - s.total) > 0.009)
      warn = `<p class="err">مجموع الأنصبة <span class="money">${fmt(s.assigned)}</span> ${s.assigned>s.total?'أكثر':'أقل'} من الإجمالي <span class="money">${fmt(s.total)}</span> بـ <span class="money">${fmt(Math.abs(s.assigned-s.total))}</span> ريال</p>`;

    const statA = bill ? ['الفاتورة', s.total] : ['الهدف', s.total];
    return `<div class="list">
      <div class="row"><button class="link" data-act="back">→ كل القطات</button>${q.example?'<span class="tag">مثال</span>':''}</div>
      <div class="hero">
        <div class="row"><h2>${esc(q.title)}</h2><span class="tag ${s.done?'done':q.type}">${s.done?'اكتملت':bill?'فاتورة':'جمع'}</span></div>
        ${bill?`<p class="small muted">${esc(payerName(q))} دفع الفاتورة${+q.tip?` وفيها خدمة ${fmt(q.tip)}%`:''}، والباقين يحوّلون له نصيبهم.</p>`:''}
        ${q.deadline?`<p class="small muted">آخر موعد: ${esc(q.deadline)}</p>`:''}
        <div class="stats">
          <div class="stat"><span>${statA[0]}</span><b class="money">${fmt(statA[1])}</b></div>
          <div class="stat"><span>${bill?'وصله':'انجمع'}</span><b class="money">${fmt(s.collected)}</b></div>
          <div class="stat"><span>الباقي</span><b class="money">${fmt(s.remaining)}</b></div>
        </div>
        <div class="bar" role="progressbar" aria-valuenow="${Math.round(s.pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${s.pct}%"></i></div>
        ${!open && q.split==='equal' ? `<p class="small">نصيب كل واحد: <b class="money">${fmt(q.members.length?s.total/q.members.length:0)}</b> ريال</p>`:''}
        ${warn}
      </div>
      <h3>${open?'المساهمات':'الأعضاء'} <span class="muted small">(${q.members.length})</span></h3>
      <div class="members">${members}</div>
      ${lock?'':`<form class="addrow" data-form="add"><input id="addName" placeholder="أضف اسم" aria-label="اسم عضو جديد" maxlength="40"><button class="btn ghost sm" type="submit">إضافة</button></form>`}
      <h3>رسالة للقروب</h3>
      <div class="share" id="shareText">${esc(shareText(q))}</div>
      <div class="actions">
        <button class="btn" data-act="copy">نسخ الرسالة</button>
        ${lock||q.example?'':`<button class="btn danger" data-act="del">حذف القطة</button>`}
      </div>
      <div id="confirmDel" hidden class="banner">متأكد تبي تحذف «${esc(q.title)}»؟ ما تقدر ترجعها.
        <div class="actions" style="margin-top:8px"><button class="btn sm" data-act="delyes" style="background:var(--bad)">احذف</button><button class="btn ghost sm" data-act="delno">لا</button></div></div>
    </div>`;
  }

  function shareText(q){
    const s = summary(q), L = [];
    if(q.type==='bill'){
      L.push(`🧾 ${q.title}`);
      L.push(`الفاتورة ${fmt(s.total)} ريال ودفعها ${payerName(q)}`);
      const due = q.members.filter(m=>m.id!==q.payerId && !m.paid);
      if(due.length){ L.push(`حوّلوا لـ ${payerName(q)}:`); due.forEach(m=>L.push(`- ${m.name}: ${fmt(shareOf(q,m))} ريال`)); }
      else L.push('الكل سدّد ✅');
    } else {
      L.push(`🎁 ${q.title}`);
      L.push(`الهدف ${fmt(s.total)} ريال، انجمع ${fmt(s.collected)} والباقي ${fmt(s.remaining)}`);
      if(q.split==='equal') L.push(`نصيب كل واحد ${fmt(q.members.length?s.total/q.members.length:0)} ريال`);
      const due = q.split==='open' ? q.members.filter(m=>!(+m.amount>0)) : q.members.filter(m=>!m.paid);
      if(due.length) L.push(`باقي: ${due.map(m=>m.name).join('، ')}`); else L.push('الكل دفع ✅');
      if(q.deadline) L.push(`آخر موعد: ${q.deadline}`);
      if(q.iban) L.push(`التحويل على: ${q.iban}`);
    }
    return L.join('\n');
  }

  function newDraft(){ return {type:'goal', title:'', target:'', total:'', tip:'', split:'equal', names:'', payer:'', iban:'', deadline:''}; }
  function formView(){
    const d = draft, bill = d.type==='bill';
    const names = d.names.split('\n').map(s=>s.trim()).filter(Boolean);
    const splitOpts = bill
      ? [['equal','بالتساوي','كل واحد نفس المبلغ'],['custom','كل واحد حسب طلبه','تكتب نصيب كل شخص']]
      : [['equal','بالتساوي','مبلغ ثابت للكل'],['open','كل واحد يساهم','بدون مبلغ محدد']];
    const per = names.length && (+(bill?d.total:d.target)>0) && d.split==='equal'
      ? r2((bill? (+d.total)*(1+(+d.tip||0)/100) : +d.target)/names.length) : null;
    return `<form class="form" data-form="create" novalidate>
      <div class="row"><h2>قطة جديدة</h2><button type="button" class="link" data-act="back">إلغاء</button></div>
      <div class="seg" role="group" aria-label="نوع القطة">
        <button type="button" data-type="goal" aria-pressed="${!bill}">جمع مبلغ لهدف<small>هدية، مناسبة، مساعدة</small></button>
        <button type="button" data-type="bill" aria-pressed="${bill}">تقسيم فاتورة<small>عشاء، استراحة، رحلة</small></button>
      </div>
      <label class="f">العنوان<input id="dTitle" data-d="title" value="${esc(d.title)}" placeholder="${bill?'عشاء الخميس':'هدية زواج خالد'}" maxlength="60"></label>
      ${bill
        ? `<div class="two"><label class="f">مبلغ الفاتورة (ريال)<input id="dTotal" data-d="total" type="number" inputmode="decimal" min="0" value="${esc(d.total)}" placeholder="640"></label>
           <label class="f">خدمة/بقشيش % (اختياري)<input id="dTip" data-d="tip" type="number" inputmode="decimal" min="0" value="${esc(d.tip)}" placeholder="0"></label></div>`
        : `<div class="two"><label class="f">المبلغ المطلوب (ريال)${d.split==='open'?' — اختياري':''}<input id="dTarget" data-d="target" type="number" inputmode="decimal" min="0" value="${esc(d.target)}" placeholder="1200"></label>
           <label class="f">آخر موعد (اختياري)<input id="dDeadline" data-d="deadline" type="date" value="${esc(d.deadline)}"></label></div>`}
      <div class="seg" role="group" aria-label="طريقة التقسيم">
        ${splitOpts.map(([k,l,s])=>`<button type="button" data-split="${k}" aria-pressed="${d.split===k}">${l}<small>${s}</small></button>`).join('')}
      </div>
      <label class="f">الأسماء (اسم في كل سطر)<textarea id="dNames" data-d="names" placeholder="عبدالله&#10;فهد&#10;ناصر">${esc(d.names)}</textarea>
        <span class="hint">${names.length} ${names.length===1?'شخص':'أشخاص'}${per!==null?` · نصيب كل واحد <span class="money">${fmt(per)}</span> ريال`:''}</span></label>
      ${bill
        ? `<label class="f">مين دفع الفاتورة؟<select id="dPayer" data-d="payer">${names.length?names.map((n,i)=>`<option value="${i}" ${String(i)===String(d.payer)?'selected':''}>${esc(n)}</option>`).join(''):'<option value="">اكتب الأسماء أول</option>'}</select></label>`
        : `<label class="f">رقم الآيبان أو الجوال للتحويل (اختياري)<input id="dIban" data-d="iban" value="${esc(d.iban)}" placeholder="SA.. أو 05.." dir="ltr" maxlength="40"></label>`}
      <p class="err" id="formErr" hidden></p>
      <button class="btn" type="submit">إنشاء القطة</button>
    </form>`;
  }

  function createFromDraft(){
    const d = draft, bill = d.type==='bill';
    const names = d.names.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,50);
    const err = m => { const e=$('formErr'); e.textContent=m; e.hidden=false; };
    if(!d.title.trim()) return err('اكتب عنوان للقطة');
    if(names.length<2) return err('أضف اسمين على الأقل');
    if(bill && !(+d.total>0)) return err('اكتب مبلغ الفاتورة');
    if(!bill && d.split==='equal' && !(+d.target>0)) return err('اكتب المبلغ المطلوب');
    const members = names.map(n=>({id:uid(), name:n.slice(0,40), paid:false, amount:0}));
    const q = {id:uid()+Date.now().toString(36), type:d.type, title:d.title.trim().slice(0,60), split:d.split, members, createdAt:Date.now()};
    if(bill){
      q.total = r2(d.total); q.tip = r2(d.tip||0);
      const p = members[+d.payer||0]; q.payerId = p.id; p.paid = true;
      if(d.split==='custom'){ const each = r2(totalOf(q)/members.length); members.forEach(m=>m.amount=each); }
    } else {
      q.target = r2(d.target||0); q.iban = d.iban.trim(); q.deadline = d.deadline;
    }
    items.push(q); persist(q);
    route = {name:'detail', id:q.id}; draft = null; render();
    toast('انشأت القطة');
  }

  /* ---------- events ---------- */
  document.addEventListener('click', async e=>{
    const t = e.target.closest('button'); if(!t || !$('app').contains(t)) return;
    const q = route.name==='detail' ? find(route.id) : null;
    if(t.dataset.open){ route={name:'detail', id:t.dataset.open}; render(); window.scrollTo(0,0); return; }
    if(t.dataset.type){ draft.type=t.dataset.type; draft.split='equal'; render(); return; }
    if(t.dataset.split){ draft.split=t.dataset.split; render(); return; }
    if(t.dataset.toggle && q && !readOnly){ const m=q.members.find(x=>x.id===t.dataset.toggle); m.paid=!m.paid; persist(q); render(); return; }
    if(t.dataset.rm && q && !readOnly){ q.members=q.members.filter(x=>x.id!==t.dataset.rm); persist(q); render(); return; }
    switch(t.dataset.act){
      case 'new': draft=newDraft(); route={name:'new'}; render(); $('dTitle')?.focus(); break;
      case 'back': route={name:'list'}; draft=null; render(); break;
      case 'copy': {
        const txt = shareText(q);
        try{ await navigator.clipboard.writeText(txt); toast('نسخت الرسالة، الصقها في القروب'); }
        catch(_){ const r=document.createRange(); r.selectNodeContents($('shareText')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('حددت الرسالة، انسخها يدوياً'); }
        break; }
      case 'del': $('confirmDel').hidden=false; break;
      case 'delno': $('confirmDel').hidden=true; break;
      case 'delyes': await removeDoc(q.id); route={name:'list'}; render(); toast('انحذفت القطة'); break;
    }
  });
  document.addEventListener('input', e=>{
    const el = e.target;
    if(el.dataset.d && draft){
      draft[el.dataset.d] = el.value;
      if(el.dataset.d==='names' || el.dataset.d==='total' || el.dataset.d==='target' || el.dataset.d==='tip'){
        // refresh hint + payer list without losing focus
        const pos = el.selectionStart; render(); const again = $(el.id); if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(_){} }
      }
      return;
    }
    if(el.dataset.amt && route.name==='detail'){
      const q = find(route.id), m = q.members.find(x=>x.id===el.dataset.amt);
      m.amount = r2(el.value); clearTimeout(el._t);
      el._t = setTimeout(()=>{ persist(q); const pos=el.selectionStart, id=el.id; render(); const a=$(id); if(a){a.focus(); try{a.setSelectionRange(pos,pos);}catch(_){}} }, 500);
    }
  });
  document.addEventListener('submit', e=>{
    e.preventDefault();
    const f = e.target.dataset.form;
    if(f==='create') createFromDraft();
    if(f==='add' && !readOnly){
      const q = find(route.id), n = $('addName').value.trim(); if(!n) return;
      q.members.push({id:uid(), name:n.slice(0,40), paid:false, amount: q.split==='custom' ? 0 : 0});
      persist(q); render(); $('addName')?.focus();
    }
  });

  let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true, 2200); }

  /* ---------- boot ---------- */
  items = loadLocal();
  render();
  const use = window.claude && window.claude.use ? window.claude.use.bind(window.claude) : null;
  if(use){
    use('db').then(async d=>{
      if(!d) return;
      db = d; shared = true;
      try{ const u = await use('user'); if(u && typeof u.can==='function'){ const ok = await u.can('data.write'); if(ok===false) readOnly = true; } }catch(_){}
      db.collection('qattas').onSnapshot(snap=>{
        items = snap.docs.filter(x=>x.exists).map(x=>JSON.parse(JSON.stringify(x.data())));
        // pending local edits win until written
        Object.keys(pending).forEach(id=>{ const i=items.findIndex(x=>x.id===id); if(i>=0) items[i]=pending[id]; });
        const a = document.activeElement;
        if(a && a.tagName==='INPUT' && a.dataset.amt){ a.addEventListener('blur', render, {once:true}); return; }
        if(route.name==='new') { setStatus(); return; }
        render();
      }, err=>{ if(err && err.code==='revoked'){ shared=false; render(); } });
    }).catch(()=>{});
  }
})();
</script>
